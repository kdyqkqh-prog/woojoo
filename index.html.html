<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정확한 서버 시간 · 밀리초 시계</title>
<meta name="description" content="티켓팅, 수강신청 전에 내 기기 시계가 몇 초 틀린지 확인하세요. 밀리초 단위 서버 시간과 오픈 시각 카운트다운.">
<style>
  :root {
    --page: #DDE2F3;
    --blue: #2438E0;
    --paper: #FFFFFF;
    --ink: #0C1236;
    --chalk: #F4F6FF;
    --signal: #FFD60A;
    --muted: #5B648F;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 24px 16px 48px;
    background: var(--page);
    color: var(--ink);
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
      "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Segoe UI", sans-serif;
  }
  .layout { max-width: 560px; margin: 0 auto; }
  .ad { display: none; }
  @media (min-width: 1100px) {
    .layout {
      max-width: none;
      display: grid;
      grid-template-columns: 160px minmax(0, 560px) 160px;
      gap: 32px;
      justify-content: center;
      align-items: start;
      padding-top: 40px;
    }
    .ad {
      display: grid;
      place-items: center;
      min-height: 600px;
      border: 1px dashed #9AA3CF;
      border-radius: 8px;
      color: #8089B5;
      font-size: 13px;
    }
  }

  .ticket { filter: drop-shadow(0 18px 30px rgba(12, 18, 54, .18)); }

  .top {
    background: var(--blue);
    color: var(--chalk);
    padding: 28px 24px 20px;
    border-radius: 22px 22px 0 0;
  }
  .label { margin: 0; font-size: 14px; font-weight: 600; opacity: .8; }
  .clock {
    margin: 8px 0 12px;
    font-size: clamp(40px, 12vw, 72px);
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -.02em;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .ms { font-size: .5em; font-weight: 700; opacity: .8; margin-left: .08em; }
  .status { margin: 0 0 16px; font-size: 14px; line-height: 1.55; max-width: 40ch; }
  button {
    min-height: 44px;
    padding: 0 18px;
    border: 2px solid var(--chalk);
    border-radius: 8px;
    background: transparent;
    color: var(--chalk);
    font: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }

  .perf { position: relative; height: 24px; background: linear-gradient(var(--blue) 50%, var(--paper) 50%); }
  .perf::before, .perf::after {
    content: "";
    position: absolute;
    top: 0;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--page);
  }
  .perf::before { left: -12px; }
  .perf::after { right: -12px; }
  .perf span { position: absolute; left: 20px; right: 20px; top: 11px; border-top: 2px dashed #8C99EE; }

  .stub {
    background: var(--paper);
    padding: 20px 24px 28px;
    border-radius: 0 0 22px 22px;
    transition: background-color .2s;
  }
  .stub.soon, .stub.now { background: var(--signal); }
  .stub .label { color: var(--ink); opacity: .75; }
  input[type="time"] {
    display: block;
    margin: 8px 0 16px;
    padding: 10px 12px;
    border: 2px solid var(--ink);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
    font: inherit;
    font-size: 20px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .count {
    font-size: clamp(36px, 10vw, 56px);
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
  }
  .hint { margin: 10px 0 0; font-size: 13px; color: var(--muted); }
  .stub.soon .hint, .stub.now .hint { color: var(--ink); }
  .note { margin: 20px 4px 0; font-size: 13px; line-height: 1.6; color: var(--muted); }
</style>
</head>
<body>
<div class="layout">
  <aside class="ad" aria-hidden="true"><!-- 왼쪽 광고 코드(애드센스)를 여기에 넣으세요 -->광고 자리</aside>

  <div>
    <main class="ticket">
      <section class="top">
        <p class="label">현재 시간 · 한국 표준시</p>
        <div class="clock" aria-live="off"><span id="hms">--:--:--</span><span class="ms" id="ms">.---</span></div>
        <p class="status" id="status">서버 시간을 맞추는 중…</p>
        <button id="resync" type="button">다시 맞추기</button>
      </section>

      <div class="perf" aria-hidden="true"><span></span></div>

      <section class="stub" id="stub">
        <label class="label" for="target">오픈 시각</label>
        <input id="target" type="time" step="1">
        <div class="count" id="count">--:--.-</div>
        <p class="hint">오늘 날짜 기준이에요. 10초 전부터 노란색으로 바뀌어요.</p>
      </section>
    </main>

    <p class="note">시계는 이 사이트가 올라간 서버의 시간을 기준으로 해요. 예매 사이트의 서버 시간과는 조금 다를 수 있어요.</p>
  </div>

  <aside class="ad" aria-hidden="true"><!-- 오른쪽 광고 코드(애드센스)를 여기에 넣으세요 -->광고 자리</aside>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const hmsEl = $('hms'), msEl = $('ms'), statusEl = $('status'), resyncBtn = $('resync');
  const targetEl = $('target'), countEl = $('count'), stubEl = $('stub');

  const KST = 9 * 3600 * 1000;
  const pad = (n, l = 2) => String(n).padStart(l, '0');
  const localNow = () => performance.timeOrigin + performance.now();

  let offset = 0;      // 서버 시간 - 기기 시간 (ms)
  let spread = 0;      // 오차 범위 ± (ms)
  let synced = false;
  let busy = false;

  const serverNow = () => localNow() + offset;

  function kstParts(ms) {
    const d = new Date(ms + KST);
    return { h: d.getUTCHours(), m: d.getUTCMinutes(), s: d.getUTCSeconds(), ms: d.getUTCMilliseconds() };
  }

  // 서버 응답의 Date 헤더는 초 단위라서, 여러 번 재서 범위를 좁힌다.
  async function sample() {
    const url = location.pathname + '?_=' + Math.random().toString(36).slice(2);
    const sent = localNow();
    const res = await fetch(url, { method: 'HEAD', cache: 'no-store' });
    const received = localNow();
    const header = res.headers.get('Date');
    if (!header) throw new Error('Date 헤더 없음');
    const serverSec = Date.parse(header);
    return { lo: serverSec - received, hi: serverSec + 1000 - sent };
  }

  function renderStatus() {
    if (!synced) {
      statusEl.textContent = '서버 시간을 가져오지 못해서 지금은 내 기기 시계로 보여줘요. 웹사이트로 올린 주소(https)에서 열면 맞춰져요.';
      return;
    }
    const device = -offset; // 기기 - 서버
    const range = (spread / 1000).toFixed(3);
    if (Math.abs(device) < 5) {
      statusEl.textContent = `내 기기 시계는 서버와 거의 같아요 (오차 ±${range}초)`;
    } else {
      const secs = (Math.abs(device) / 1000).toFixed(3);
      statusEl.textContent = `내 기기 시계가 서버보다 ${secs}초 ${device < 0 ? '느려요' : '빨라요'} (오차 ±${range}초)`;
    }
  }

  async function sync() {
    if (busy) return;
    busy = true;
    resyncBtn.disabled = true;
    statusEl.textContent = '서버 시간을 맞추는 중…';
    let lo = -Infinity, hi = Infinity, count = 0;
    try {
      for (let i = 0; i < 24; i++) {
        const s = await sample();
        const nlo = Math.max(lo, s.lo), nhi = Math.min(hi, s.hi);
        if (nlo <= nhi) { lo = nlo; hi = nhi; } else { lo = s.lo; hi = s.hi; }
        count++;
        if (hi - lo < 40) break;
        await new Promise(r => setTimeout(r, 40 + Math.random() * 330));
      }
    } catch (e) { /* 일부라도 성공했으면 그 값을 사용 */ }
    if (count > 0) {
      offset = (lo + hi) / 2;
      spread = (hi - lo) / 2;
      synced = true;
    } else {
      synced = false;
      offset = 0;
    }
    busy = false;
    resyncBtn.disabled = false;
    renderStatus();
  }

  function updateCount(t) {
    if (!targetEl.value) {
      countEl.textContent = '--:--.-';
      stubEl.classList.remove('soon', 'now');
      return;
    }
    const [th, tm, ts = 0] = targetEl.value.split(':').map(Number);
    const p = kstParts(t);
    const nowMs = ((p.h * 60 + p.m) * 60 + p.s) * 1000 + p.ms;
    const diff = ((th * 60 + tm) * 60 + ts) * 1000 - nowMs;

    if (diff > 0) {
      const sec = Math.floor(diff / 1000);
      const tenth = Math.floor((diff % 1000) / 100);
      const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
      countEl.textContent = h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}.${tenth}`;
      stubEl.classList.toggle('soon', diff <= 10000);
      stubEl.classList.remove('now');
    } else if (diff > -3000) {
      countEl.textContent = '지금!';
      stubEl.classList.remove('soon');
      stubEl.classList.add('now');
    } else {
      countEl.textContent = '지났어요';
      stubEl.classList.remove('soon', 'now');
    }
  }

  function tick() {
    const t = serverNow();
    const p = kstParts(t);
    hmsEl.textContent = `${pad(p.h)}:${pad(p.m)}:${pad(p.s)}`;
    msEl.textContent = '.' + pad(p.ms, 3);
    updateCount(t);
    requestAnimationFrame(tick);
  }

  resyncBtn.addEventListener('click', sync);
  setInterval(sync, 5 * 60 * 1000);
  sync();
  tick();
})();
</script>
</body>
</html>
